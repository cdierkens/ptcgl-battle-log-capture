[package]
name = "ptcgl-battle-log-capture"
version = "0.1.0"
edition = "2021"

[lib]
name = "ptcgl_battle_log_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
xcap = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
unicode-normalization = "0.1"
trash = "5"
# 2.6+ needs rustc 1.90; the toolchain is 1.86.
tauri-plugin-opener = "~2.5"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-vision = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSWindow", "NSWorkspace"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
